name: Android checks and package
on:
  push:
    branches: [main]
    paths: ['android/**', 'shared/**', '.github/workflows/caltrain-android*.yml']
  pull_request:
    paths: ['android/**', 'shared/**', '.github/workflows/caltrain-android*.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Confirm production mode rejects missing credentials
        run: |
          if ./gradlew help -PcaltrainRelease=true --console=plain > "$RUNNER_TEMP/missing-signing.log" 2>&1; then
            echo 'Production mode accepted missing signing credentials'; exit 1
          fi
          grep -q 'Production releases require all signing credentials' "$RUNNER_TEMP/missing-signing.log"
      - name: Build and verify APK with disposable CI key
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          CALTRAIN_OFFLINE_PACKAGE: 'true'
        run: bash tools/check-package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ci-test-only
          path: ${{ runner.temp }}/android-release/
          if-no-files-found: error
