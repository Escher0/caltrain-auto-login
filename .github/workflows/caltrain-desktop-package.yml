name: Prepare Caltrain Windows package

# Deliberately manual and artifact-only. Publishing to the public
# repository is a separate operation; this never creates a GitHub release.
on:
  pull_request:
    paths: ['desktop-tauri/**', '.github/workflows/caltrain-*', 'LICENSE', 'LICENSING.md']
  workflow_dispatch:
    inputs:
      signed_update:
        description: Build a signed update with the configured repository secrets
        type: boolean
        default: false
      release_repository:
        description: Public owner/repo (required for signed updates)
        type: string
        default: 'Escher0/caltrain-auto-login'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-tauri
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python tools/check-signatures.py
      - run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: Build installer and optional signed manifest
        env:
          SIGNED_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_update }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository || github.repository }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ github.event_name == 'workflow_dispatch' && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          ./tools/package-windows.ps1 -Repository $env:RELEASE_REPOSITORY -Version $version -Output "$env:RUNNER_TEMP/caltrain-package" -Signed:($env:SIGNED_UPDATE -eq 'true')
      - name: Verify installer and startup cleanup on disposable runner
        run: |
          $installer = @(Get-ChildItem "$env:RUNNER_TEMP/caltrain-package/*-setup.exe")
          if ($installer.Count -ne 1) { throw 'Expected one staged installer' }
          ./tools/test-installer.ps1 -Installer $installer[0].FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caltrain-windows
          path: ${{ runner.temp }}/caltrain-package/
          if-no-files-found: error
